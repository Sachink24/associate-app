<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLITAIRE · Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    body{margin:0;min-height:100vh;background:#0a0a0f;color:#f5e7c8;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:min(440px,100%);background:#171724;border:1px solid rgba(201,168,76,.35);border-radius:28px;padding:34px 26px;box-shadow:0 25px 60px rgba(0,0,0,.55)}
    .brand{text-align:center;margin-bottom:26px}
    .gem{font-size:42px;color:#c9a84c}
    h1{margin:8px 0 4px;font-size:28px;letter-spacing:1px}
    .sub{color:#9b917d;font-size:14px}
    label{display:block;margin:18px 0 8px;color:#c7bda9;font-weight:700;font-size:13px;text-transform:uppercase}
    input{width:100%;padding:15px 16px;border:0;border-radius:16px;background:#eaf1ff;color:#111827;font-size:16px;outline:none}
    button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:18px;background:#d5af45;color:#17130a;font-size:17px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{min-height:24px;margin-top:18px;text-align:center;font-size:14px;line-height:1.45}
    .error{color:#ff7b7b}.ok{color:#6ad49a}.info{color:#c9bfae}
    .back{display:block;text-align:center;margin-top:18px;color:#c9a84c;text-decoration:none}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="gem">◆</div>
      <h1>SOLITAIRE</h1>
      <div class="sub">Secure Underwriting Desk · India</div>
    </div>

    <div id="loading" class="msg info">Verifying your password reset link…</div>

    <form id="resetForm" class="hidden">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Enter new password">

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Confirm new password">

      <button id="submitBtn" type="submit">Update Password</button>
      <div id="message" class="msg"></div>
    </form>

    <a id="backLink" class="back hidden" href="index.html">← Back to Sign In</a>
  </main>

<script>
(function () {
  const SUPABASE_URL = "https://nbpvamrwzqrgoiwpadwc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_GrJ_9z_y903WFMGjoAg82Q_cG3N2_Jx";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      flowType: "implicit",
      detectSessionInUrl: true,
      persistSession: true,
      autoRefreshToken: true
    }
  });

  const loading = document.getElementById("loading");
  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const backLink = document.getElementById("backLink");
  const submitBtn = document.getElementById("submitBtn");

  let recoveryReady = false;

  function showForm() {
    recoveryReady = true;
    loading.classList.add("hidden");
    form.classList.remove("hidden");
    backLink.classList.remove("hidden");
    document.getElementById("newPassword").focus();

    // Remove auth tokens from the visible browser URL after Supabase has processed them.
    if (window.history && window.history.replaceState && (window.location.hash || window.location.search)) {
      const cleanUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
    }
  }

  function showError(text) {
    loading.classList.add("hidden");
    form.classList.add("hidden");
    backLink.classList.remove("hidden");
    loading.classList.remove("hidden");
    loading.className = "msg error";
    loading.textContent = text;
  }

  sb.auth.onAuthStateChange(async function (event, session) {
    if (event === "PASSWORD_RECOVERY" || (session && session.user)) {
      showForm();
    }
  });

  // Handles browsers where the recovery event fires very quickly.
  setTimeout(async function () {
    const { data, error } = await sb.auth.getSession();
    if (!error && data && data.session) {
      showForm();
    } else if (!recoveryReady) {
      const hash = window.location.hash || "";
      const query = window.location.search || "";
      if (!hash.includes("access_token") && !query.includes("code")) {
        showError("This reset link is missing or has expired. Please request a new reset link.");
      } else {
        loading.textContent = "The reset link could not be verified. Please request a new link.";
        loading.className = "msg error";
        backLink.classList.remove("hidden");
      }
    }
  }, 1200);

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!recoveryReady) return;

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    message.className = "msg";

    if (newPassword.length < 6) {
      message.className = "msg error";
      message.textContent = "Password must be at least 6 characters.";
      return;
    }
    if (newPassword !== confirmPassword) {
      message.className = "msg error";
      message.textContent = "Passwords do not match.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";

    const { error } = await sb.auth.updateUser({ password: newPassword });

    if (error) {
      message.className = "msg error";
      message.textContent = "Could not update password: " + error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = "Update Password";
      return;
    }

    message.className = "msg ok";
    message.textContent = "✓ Password updated successfully. Redirecting to Sign In…";
    await sb.auth.signOut();

    setTimeout(function () {
      window.location.href = "index.html?password_reset=success";
    }, 1200);
  });
})();
</script>
</body>
</html>
